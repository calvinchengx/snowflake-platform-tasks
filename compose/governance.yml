# OpenMetadata -- the human catalog.
#
# THE IMAGES COME FROM THE FAMILY'S OWN REGISTRY, not from the vendor's (G44).
# `docker.getcollate.io` is backed by neither Docker Hub nor GHCR, four
# repositories pull it on nightly crons, and on 2026-08-22 it took two of them
# down: a TLS handshake timeout, then `connection reset by peer` on the rerun
# nineteen minutes later. The bounded retry fabric-emulator carries for exactly
# this would not have saved either.
#
# `calvinchengx/emulators` copies the manifest INDEX into GHCR with
# `buildx imagetools create` and records the digest the registry serves;
# `mirrors.json` there is the declaration and its weekly check is what would
# notice a mirror going missing or losing an architecture. Both indexes carry
# linux/amd64 and linux/arm64, and their digests are identical to upstream's.
#
# BY TAG, like every other image this platform pins, with the version in
# versions.env. The digest lives in the hub, in one place for all four
# consumers, rather than being copied into four repositories where
# `repo:tag@digest` would let a version bump silently keep running the old
# bytes -- docker resolves the digest and ignores the tag beside it.
services:
  om-postgresql:
    profiles: [governance]
    image: ghcr.io/calvinchengx/openmetadata-postgresql:${OPENMETADATA_VERSION:?see versions.env}@${OPENMETADATA_PG_DIGEST:?see versions.env}
    command: "--work_mem=10MB"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - om-db-data:/var/lib/postgresql/data
    healthcheck:
      test: psql -U postgres -tAc 'select 1' -d openmetadata_db
      interval: 15s
      timeout: 10s
      retries: 10

  om-opensearch:
    profiles: [governance]
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:?see versions.env}@${OPENSEARCH_DIGEST:?see versions.env}
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    volumes:
      - om-search-data:/usr/share/opensearch/data
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10

  om-migrate:
    profiles: [governance]
    image: ghcr.io/calvinchengx/openmetadata-server:${OPENMETADATA_VERSION:?see versions.env}@${OPENMETADATA_SERVER_DIGEST:?see versions.env}
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment: &om_env
      DB_HOST: om-postgresql
      DB_PORT: "5432"
      DB_SCHEME: postgresql
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      SEARCH_TYPE: opensearch
      ELASTICSEARCH_HOST: om-opensearch
    depends_on:
      om-postgresql: {condition: service_healthy}
      om-opensearch: {condition: service_healthy}

  openmetadata:
    profiles: [governance]
    image: ghcr.io/calvinchengx/openmetadata-server:${OPENMETADATA_VERSION:?see versions.env}@${OPENMETADATA_SERVER_DIGEST:?see versions.env}
    ports: ["${OM_PORT:-18586}:8585"]
    environment: *om_env
    depends_on:
      om-migrate:
        condition: service_completed_successfully

volumes:
  om-db-data:
  om-search-data:
