# Snowflake account emulator. Consumer-owned, pin from versions.env.
services:
  snowflake:
    image: ghcr.io/calvinchengx/snowflake-emulator:${SNOWFLAKE_EMULATOR_VERSION:?see versions.env}@${SNOWFLAKE_EMULATOR_DIGEST:?see versions.env}
    ports:
      - "18448:8448"
    volumes:
      - ${SNOWFLAKE_DATA:-./data}:/data
      # THE INTERNAL STAGE, as a host directory. SNOWFLAKE_STAGE_DIR pointed at
      # a path inside the container, so nothing outside could put a file there
      # and `COPY INTO` had nothing to read -- which is why this cell has only
      # ever had empty silver tables. Ingest writes the vendors' bytes here and
      # the warehouse copies them in, which is what a Snowflake team does with
      # an internal stage.
      - ${SNOWFLAKE_STAGES:-./stages}:/stages
    environment:
      SNOWFLAKE_ADDR: "0.0.0.0:8448"
      SNOWFLAKE_DATA_DIR: /data
      SNOWFLAKE_STAGE_DIR: /stages
      # WHERE THE STAGE IS FROM THE CLIENT'S SIDE, which is not where it is from
      # the server's. The steps run on the HOST and the warehouse runs in a
      # container, so the upload response has to name a path the client can
      # actually write to -- the host side of the bind mount above, not
      # `/stages`, which means nothing out there.
      #
      # The Airflow 3 platform needs no equivalent: its client is a container
      # that mounts the same volume at the same path, so server and client agree
      # without being told.
      SNOWFLAKE_STAGE_CLIENT_DIR: ${SNOWFLAKE_STAGES:-./stages}
      SNOWFLAKE_DUCKDB_PATH: /data/warehouse.duckdb
      SNOWFLAKE_POLARIS_URL: embedded
      SNOWFLAKE_PUBLIC_URL: http://127.0.0.1:18448
    healthcheck:
      test: ["CMD", "snowflake-emulator", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
