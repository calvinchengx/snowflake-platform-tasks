[project]
name = "snowflake-platform-tasks"
version = "0.1.0"
description = "Contoso-free platform: snowflake-emulator (or a real Snowflake account), driven through Snowflake Tasks"
requires-python = ">=3.12"

# NO RUNTIME DEPENDENCIES, and that is the point rather than an omission.
#
# Until the split this repository declared snowflake-target, contoso-data-product,
# requests, confluent-kafka, psycopg, pyarrow, a connector group and a dbt group
# -- because it contained the product that imports them. The steps went to
# contoso-data-product-snowflake-tasks, and what is left here reaches for
# nothing outside the standard library: compose.py, doctor.py, set_release.py,
# token.py, check_product_pin.py, sources.py and the repo tests.
#
# THE THIRTEEN ADVISORIES WENT WITH THEM. cryptography, pyopenssl and sqlparse
# all arrived through dbt-snowflake, and the `override-dependencies` block that
# resolved them (#9) now lives in the product, which is the lock dbt actually
# runs from. Keeping the declarations here would keep a vulnerable dependency
# tree alive in a lockfile that installs nothing.
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.14,<0.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
