# The claim this repository exists to make: a PUBLISHED snowflake-emulator
# carries the Contoso product end to end -- ingest, bronze, silver, gold and the
# ODCS contracts -- with OpenMetadata alongside.
#
# SINCE THE SPLIT, THAT TAKES TWO REPOSITORIES. This one owns the stack; the
# steps live in contoso-data-product-snowflake-tasks and are checked out below.
# `make verify` without a PRODUCT would run the empty ./product mount point.
name: Acceptance

on:
  repository_dispatch:
    types: [snowflake-emulator-release]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  verify:
    name: Verify the released emulator end to end
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    defaults:
      run:
        working-directory: snowflake-platform-tasks
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: snowflake-platform-tasks
      # THE PRODUCT THIS PLATFORM RUNS. It is checked out rather than named in
      # the Makefile, which holds no product identifier -- the property that
      # makes "a second product can use this platform unchanged" testable.
      - uses: actions/checkout@v7
        with:
          repository: calvinchengx/contoso-data-product-snowflake-tasks
          path: contoso-data-product-snowflake-tasks
      # The vendors are DECLARED in contoso-sources and materialised from it, so
      # compose.py hard-requires the checkout beside this one. It is not
      # optional and not a fixture we could vendor: the point of reading the
      # declaration is that this platform's vendor list is not a copy.
      #
      # It was missing until the split -- `make up` could not have succeeded in
      # this workflow since the four vendors were added.
      - uses: actions/checkout@v7
        with:
          repository: calvinchengx/contoso-sources
          path: contoso-sources
      # THE FAMILY'S FIGURES, from the repository that owns them. This checkout
      # was already here and unused; the step at the end of this job is what it
      # is now for.
      #
      # PINNED BY SHA, not tracking main. Core's own rules say a release is the
      # unit of change and nothing tracks main, and a nightly whose expectations
      # can move without a reviewed commit here is a nightly that can be turned
      # green by editing another repository. A SHA is also what this workflow
      # already does for every third-party action. Move it deliberately, and
      # only when the family's numbers move.
      - uses: actions/checkout@v7
        with:
          repository: calvinchengx/contoso-data-product
          ref: 2cf7bae8a1e1f4a8cddd2cd5510d435e16febb3b
          path: contoso-data-product
      - uses: actions/checkout@v7
        with:
          repository: calvinchengx/snowflake-emulator
          path: snowflake-emulator
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        working-directory: ${{ github.workspace }}
      - if: github.event_name == 'repository_dispatch'
        name: Point at the released version
        # THE CLIENT WHEEL IS THE PRODUCT'S PIN NOW, and this job does not reach
        # into another repository to move it. If the product still installs the
        # previous client, `make verify` refuses at check_product_pin.py before
        # any step runs, and this run goes RED.
        #
        # That is the intended behaviour rather than an oversight: the
        # alternative is bumping the checked-out product in place and publishing
        # a green for a pair that exists in no commit anywhere. A release now
        # needs two bumps, and this is where a forgotten second one surfaces.
        run: |
          uv run --no-project python scripts/set_release.py \
            "${{ github.event.client_payload.version }}"
          git --no-pager diff --stat versions.env
      # THE BYTES, not just the declaration checked out above. compose.py
      # refuses without them, and that refusal is why this job went red the
      # first time the cell had vendors at all: mokapi does not fail on an
      # empty _data/, it generates bodies from the OpenAPI schema and answers
      # every request 200, so the alternative to refusing is a medallion built
      # on invented rows. The sibling platforms that made this split first
      # carry the same step.
      - name: Materialise the vendor exports
        run: make sources
        working-directory: contoso-sources
      - run: make doctor
      - run: make config
      - run: make up PRODUCT=../contoso-data-product-snowflake-tasks
      - run: make verify PRODUCT=../contoso-data-product-snowflake-tasks
      # THE NUMBERS, not merely the run (G50). Everything above proves the
      # pipeline executed; this is the only step that can fail because gold
      # returned different money. `make verify` writes product_snapshot.json and
      # until now nothing read it back, so a cell whose gold silently drifted
      # would have stayed green indefinitely.
      #
      # No `if: always()`. A failed run has no numbers worth checking, and a
      # missing snapshot after a SUCCESSFUL run is a finding the script reports
      # as one rather than skipping.
      - name: Assert the figures core publishes
        run: |
          python3 ../contoso-data-product/scripts/assert_snapshot.py \
            --label snowflake-platform-tasks \
            ../contoso-data-product-snowflake-tasks/product_snapshot.json
      - if: github.event_name == 'repository_dispatch'
        name: Adopt the version this run just verified
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet versions.env; then
            echo "already pinned at $VERSION; nothing to adopt"
            exit 0
          fi
          git commit -qm "pin $VERSION — adopted by the acceptance run that verified it" \
            versions.env
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          echo "adopted $VERSION" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: make down PRODUCT=../contoso-data-product-snowflake-tasks
