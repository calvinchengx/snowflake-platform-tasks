name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Repo tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: snowflake-platform-tasks
    steps:
      - uses: actions/checkout@v7
        with:
          path: snowflake-platform-tasks
      # ONE SIBLING, AND IT IS NOT A RUNTIME DEPENDENCY. The rule this replaces
      # said no sibling checkouts at all: contoso-data-product and
      # snowflake-target both went to the product in the split, and this
      # platform declares no runtime dependency on anything. That is still
      # true and still the point.
      #
      # What is checked out here is a test INPUT. `scripts/sources.py`
      # generates the vendor compose fragment from `contoso-sources`'
      # declaration, and the test that keeps `vendor-ports.json` honest
      # regenerates that fragment to compare. Committing a copy of the
      # declaration instead would be the duplicate this family refuses; a test
      # that SKIPPED without it would be worse still, because CI is the only
      # place the check matters and it would pass there by never running.
      - uses: actions/checkout@v7
        with:
          repository: calvinchengx/contoso-sources
          path: contoso-sources
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: matrix.os == 'windows-latest'
        run: choco install make --no-progress -y
        working-directory: ${{ github.workspace }}
      - run: uv sync --frozen --group dev
      - run: make help
      - run: make lint
      - run: make test
      # ruff was configured in pyproject.toml and never run, so the config
      # described an intention rather than a guarantee.
      - name: ruff
        run: uvx ruff@0.15.22 check .
